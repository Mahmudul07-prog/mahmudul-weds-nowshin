<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142b23" />
      <stop offset="100%" stop-color="#091511" />
    </linearGradient>
    <linearGradient id="goldGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGroom)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGroom)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldGroom)" stroke-width="1" opacity="0.3"/>
  
  <!-- Groom Silhouette with Sherwani / Turban / Collar hint -->
  <g fill="url(#goldGroom)" opacity="0.85" filter="url(#glow)">
    <!-- Head -->
    <circle cx="200" cy="140" r="46" />
    <!-- Turban / Pagri hint -->
    <path d="M160 135 C165 95, 235 95, 240 135 C230 115, 170 115, 160 135 Z" fill="#ffffff" opacity="0.4"/>
    <!-- Pagri Jewel -->
    <circle cx="200" cy="115" r="4" fill="#ffffff" />
    <path d="M200 111 L200 95" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Torso / Royal Sherwani Collar -->
    <path d="M130 270 C130 205, 155 190, 200 190 C245 190, 270 205, 270 270 C270 300, 130 300, 130 270 Z" />
    <path d="M185 190 L200 230 L215 190" fill="none" stroke="#091511" stroke-width="3" />
    <!-- Buttons -->
    <circle cx="200" cy="242" r="3" fill="#091511" />
    <circle cx="200" cy="256" r="3" fill="#091511" />
    <circle cx="200" cy="270" r="3" fill="#091511" />
  </g>
  
  <text x="200" y="340" text-anchor="middle" fill="#d4af37" font-family="Georgia, serif" font-size="16" letter-spacing="4">THE GROOM</text>
</svg>