<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="85%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <radialGradient id="goldSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Irregular Wax Shape -->
  <path d="M80 10 C100 8, 120 18, 135 32 C150 48, 155 70, 152 90 C149 112, 138 132, 120 144 C100 156, 75 155, 55 148 C35 140, 18 126, 11 106 C5 86, 10 65, 22 48 C35 28, 58 12, 80 10 Z" 
        fill="url(#waxGrad)" 
        filter="url(#sealShadow)"/>

  <!-- Inner Embossed Ring -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="80" cy="80" r="46" fill="none" stroke="url(#goldSeal)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Monogram Rings / Heart -->
  <g fill="none" stroke="url(#goldSeal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="68" cy="78" r="18" />
    <circle cx="92" cy="78" r="18" />
  </g>
  <!-- Diamond sparkle on ring -->
  <polygon points="68,54 71,59 76,59 72,63 74,68 68,65 62,68 64,63 60,59 65,59" fill="#fef08a" />
  
  <text x="80" y="112" text-anchor="middle" fill="#fef08a" font-family="Georgia, serif" font-size="10" font-weight="bold" letter-spacing="2">ROYAL UNION</text>
</svg>