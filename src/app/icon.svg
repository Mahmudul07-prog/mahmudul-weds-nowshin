<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be" />
      <stop offset="25%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#aa8214" />
      <stop offset="100%" stop-color="#78590c" />
    </linearGradient>
    <radialGradient id="emeraldBg" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14362a" />
      <stop offset="60%" stop-color="#081812" />
      <stop offset="100%" stop-color="#030a08" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring with Subtle Glow -->
  <circle cx="100" cy="100" r="94" fill="url(#emeraldBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)" />
  <!-- Inner Beaded Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5" />

  <!-- Royal Crest Crown -->
  <g transform="translate(100, 44)" filter="url(#goldGlow)">
    <path d="M -22 0 L -14 -12 L 0 -4 L 14 -12 L 22 0 Z" fill="url(#goldGrad)" />
    <circle cx="-14" cy="-15" r="2.5" fill="#fff0be" />
    <circle cx="0" cy="-8" r="3" fill="#fff0be" />
    <circle cx="14" cy="-15" r="2.5" fill="#fff0be" />
  </g>

  <!-- Monogram: M & N -->
  <g filter="url(#goldGlow)">
    <!-- M -->
    <text x="68" y="125" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">M</text>
    <!-- & -->
    <text x="100" y="112" font-family="'Great Vibes', 'Brush Script MT', 'Baskerville', serif" font-size="34" font-weight="400" font-style="italic" fill="#fff0be" text-anchor="middle" opacity="0.95">&amp;</text>
    <!-- N -->
    <text x="132" y="125" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">N</text>
  </g>

  <!-- Bottom Botanical Laurel Wreath Flourish -->
  <g stroke="url(#goldGrad)" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 52 144 C 70 158, 130 158, 148 144" stroke-width="2" />
    <circle cx="100" cy="154" r="3" fill="#fff0be" stroke="none" />
    <path d="M 94 154 Q 86 150 82 153" stroke-width="1.2" />
    <path d="M 106 154 Q 114 150 118 153" stroke-width="1.2" />
    <path d="M 72 149 Q 65 144 63 147" stroke-width="1.2" />
    <path d="M 128 149 Q 135 144 137 147" stroke-width="1.2" />
  </g>
</svg>